<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="icon" href="./icons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script>fetch('./maintenance.html', { method: 'HEAD' }).then(r => { if (r.ok) window.location.href = './maintenance.html' })</script>
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565C0">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">🎓</div>
    <div class="login-title">EcoleDirecte</div>
    <div class="login-sub">Connectez-vous pour voir vos moyennes</div>
    <div class="field">
      <label>Identifiant</label>
      <input type="text" id="input-username" autocomplete="username" placeholder="Votre identifiant">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="input-password" autocomplete="current-password" placeholder="••••••••">
      <button class="eye-btn" id="eye-btn" type="button">👁</button>
    </div>
    <div id="login-error" class="error-box" style="display:none">
      <span>⚠️</span><span id="login-error-msg"></span>
    </div>
    <button class="btn-primary" id="btn-login"><span>Se connecter</span></button>
    <div class="login-footer">Client non-officiel — EcoleDirecte</div>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Connexion…</div>
  <div class="loading-sub"  id="loading-sub"></div>
</div>

<!-- MFA -->
<div id="screen-mfa" class="screen">
  <div class="mfa-card">
    <div class="mfa-icon">🛡️</div>
    <div class="mfa-title">Double authentification</div>
    <div class="mfa-sub">Choisissez votre réponse</div>
    <div class="mfa-question"><span>❓</span><span id="mfa-question-text"></span></div>
    <div class="mfa-options" id="mfa-options"></div>
    <button class="btn-primary" id="btn-mfa" disabled><span>Valider</span></button>
  </div>
</div>

<!-- NOTES -->
<div id="screen-grades" class="screen">
  <div class="grades-header">
    <div class="grades-header-inner">
      <div class="grades-header-top">
        <div style="flex:1">
          <h1>Mes moyennes</h1>
          <div class="student-name" id="student-name"></div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Déconnexion">
          <img src="icons/logout.png" alt="logout" style="width:20px;height:20px;">
        </button>
        <div style="flex:1;display:flex;justify-content:flex-end">
          <button class="btn-normalize" id="btn-normalize">/x</button>
        </div>
      </div>
      <div class="period-tabs"  id="period-tabs"></div>
    </div>
  </div>
  <div class="period-pager">
    <div class="period-pages" id="period-pages"></div>
  </div>
</div>

<script>
let currentPage  = 0
let normalizeOn  = false

const $ = id => document.getElementById(id)

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
  $(`screen-${name}`).classList.add('active')
}
function showLoading(text, sub = '') {
  $('loading-text').textContent = text
  $('loading-sub').textContent  = sub
  showScreen('loading')
}
function showError(msg) {
  $('login-error-msg').textContent = msg
  $('login-error').style.display   = 'flex'
}
</script>

<script src="api.js"></script>

<script>
// ── Couleurs ───────────────────────────────────────────────────────────────
/** Couleur d'une note individuelle : bleu si >= moyenne de classe du devoir (sur 20), orange sinon. */
function gradeColor(normalizedGrade, normalizedClassAvg) {
  if (normalizedClassAvg === null) return 'gray'
  return normalizedGrade >= normalizedClassAvg ? 'blue' : 'orange'
}

/** Couleur d'une matière : bleu si la moyenne élève >= moyenne de classe, orange sinon. */
function subjectColor(subjectAvg, subjectClassAvg) {
  if (subjectAvg === null) return 'gray'
  if (subjectClassAvg === null) return 'blue' // pas de moyenne classe = pas de comparaison possible
  return subjectAvg >= subjectClassAvg ? 'blue' : 'orange'
}

// ── Rendu ──────────────────────────────────────────────────────────────────

/** Rebind des événements clic sur chaque ligne de matière après injection HTML. */
function bindSubjectRowClicks() {
  $('period-pages').querySelectorAll('.subject-row:not(.no-grades)').forEach(row => {
    row.addEventListener('click', () => row.classList.toggle('open'))
  })
}

function renderGrades(studentName, periods) {
  $('student-name').textContent = studentName

  const tabsContainer  = $('period-tabs')
  const pagesContainer = $('period-pages')
  tabsContainer.innerHTML  = ''
  pagesContainer.innerHTML = ''

  // Sélectionner la période la plus récente avec des notes
  let initialPage = 0
  for (let i = periods.length - 1; i >= 0; i--) {
    if (periods[i].subjects.some(s => s.grades.some(g => g.value !== null))) {
      initialPage = i
      break
    }
  }

  periods.forEach((period, idx) => {
    // Onglet
    const tab = document.createElement('button')
    tab.className = 'period-tab' + (idx === initialPage ? ' active' : '')
    tab.textContent = `T${idx + 1}`
    tab.addEventListener('click', () => goToPage(idx))
    tabsContainer.appendChild(tab)

    // Page
    const page = document.createElement('div')
    page.className = 'period-page'
    page.innerHTML = `<div class="period-page-inner">${renderPeriodPage(period)}</div>`
    pagesContainer.appendChild(page)
  })

  bindSubjectRowClicks()

  currentPage = initialPage
  updatePager()
  showScreen('grades')
}

function renderPeriodPage(period) {
  const { generalAverage, tcAverage, optAverage } = period

  const fmtAvg = v => v != null ? `${v}/20` : '—'

  let html = `
    <div class="general-avg-card" id="gen-card-${period.periodId}"
         onclick="toggleGenCard('${period.periodId}')"
         style="cursor:pointer;flex-direction:column;gap:0;position:relative">
      ${period.isClosed ? `<div style="position:absolute;top:3px;left:3px;font-size:16px;">🔒</div>` : ''}
      <div style="display:flex;align-items:center;width:100%">
        <div class="label">
          <div class="label-title">Moyenne générale</div>
          <div class="label-period">${period.label}</div>
        </div>
        <span id="gen-chevron-${period.periodId}" style="color:rgba(255,255,255,.7);font-size:18px;margin-right:8px;transition:transform .2s">⌄</span>
        <div style="text-align:right">
          <div class="value">${fmtAvg(generalAverage)}</div>
        </div>
      </div>
      <div id="gen-detail-${period.periodId}"
           style="display:none;width:100%;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)">
        <div style="display:flex;justify-content:space-between;gap:12px">
          <div style="flex:1;background:rgba(255,255,255,.12);border-radius:10px;padding:12px">
            <div style="font-size:11px;color:rgba(255,255,255,.7);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Tronc commun</div>
            <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:4px">${fmtAvg(tcAverage)}</div>
          </div>
          <div style="flex:1;background:rgba(255,255,255,.12);border-radius:10px;padding:12px">
            <div style="font-size:11px;color:rgba(255,255,255,.7);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Options</div>
            <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:4px">${fmtAvg(optAverage)}</div>
          </div>
        </div>
      </div>
    </div>`

  html += `<div class="subjects-table">`

  period.subjects.forEach((subject, i) => {
    const nextSubject = period.subjects[i + 1]

    // Séparateur visuel quand le coefficient change entre deux matières ayant une moyenne
    const isCoefBoundary =
      nextSubject &&
      nextSubject.coefMatiere !== subject.coefMatiere &&
      subject.average !== null &&
      nextSubject.average !== null

    const hasGrades    = subject.average !== null || subject.grades.some(g => g.isDispensed || g.nonSignificatif)
    const isLastWithAvg = hasGrades && nextSubject && nextSubject.average === null
    const color        = hasGrades ? subjectColor(subject.average, subject.classAverage) : 'gray'
    const avgDisplay   = fmtAvg(subject.average)
    const classDisplay = hasGrades && subject.classAverage !== null
      ? `Classe : ${subject.classAverage.toFixed(1)}`
      : ''

    html += `
      <div class="subject-row${hasGrades ? '' : ' no-grades'}${isCoefBoundary || isLastWithAvg ? ' coef-separator' : ''}">
        <div class="subject-main">
          <div class="subject-bar bar-${color}"></div>
          <div class="subject-info">
            <div style="display:flex;align-items:center">
              <div class="subject-name">${subject.name}</div>
              <span class="subject-coef">×${subject.coefMatiere || 1}</span>
            </div>
            ${classDisplay ? `<div class="subject-class-avg">${classDisplay}</div>` : ''}
          </div>
          ${subject.grades.some(g => g.value !== null || g.isDispensed || g.nonSignificatif)
            ? '<span class="subject-chevron">⌄</span>'
            : ''}
          <div class="subject-avg c-${color}">${avgDisplay}</div>
        </div>
        <div class="subject-grades">`

    const visibleGrades = subject.grades.filter(g => g.value !== null || g.isDispensed || g.nonSignificatif)

    visibleGrades.forEach(grade => {
      // Couleur de la note : comparée à la moyenne de classe de CE devoir (ramenée sur 20)
      const classAvgNormalized = grade.classAvg !== null && grade.outOf > 0
        ? (grade.classAvg / grade.outOf) * 20
        : null
      const gradeCol   = gradeColor(grade.normalized, classAvgNormalized)
      const coefLabel  = grade.coef !== 1 ? `×${Number.isInteger(grade.coef) ? grade.coef : grade.coef}` : ''
      const outOfLabel = grade.outOf % 1 === 0 ? grade.outOf : grade.outOf.toFixed(1)

      html += `
        <div class="grade-row">
          <div class="grade-info">
            <div class="grade-name">${grade.name || 'Devoir'}</div>
            ${grade.classAvg !== null && grade.classMin !== null && grade.classMax !== null ? `
              <div class="grade-class-average">
                Classe :
                <span class="val-native">${grade.classAvg}</span>
                <span class="val-norm">${parseFloat(((grade.classAvg / grade.outOf) * 20).toFixed(2))}</span>
                Min :
                <span class="val-native">${grade.classMin}</span>
                <span class="val-norm">${parseFloat(((grade.classMin / grade.outOf) * 20).toFixed(2))}</span>
                Max :
                <span class="val-native">${grade.classMax}</span>
                <span class="val-norm">${parseFloat(((grade.classMax / grade.outOf) * 20).toFixed(2))}</span>
              </div>` : ''}
          </div>
          ${coefLabel ? `<div class="grade-coef">${coefLabel}</div>` : ''}
          ${grade.isDispensed
            ? `<div class="grade-badge c-gray bg-gray">${grade.rawVal || 'Disp.'}</div>`
            : grade.nonSignificatif
              ? `<div class="grade-badge c-gray bg-gray">(<span class="val-native">${parseFloat(grade.value.toFixed(2))}/${outOfLabel}</span><span class="val-norm">${grade.normalized !== null ? parseFloat(grade.normalized.toFixed(2)) : '?'}</span>)</div>`
              : `<div class="grade-badge c-${gradeCol} bg-${gradeCol}"><span class="val-native">${parseFloat(grade.value.toFixed(2))}/${outOfLabel}</span><span class="val-norm">${grade.normalized !== null ? parseFloat(grade.normalized.toFixed(2)) : '?'}</span></div>`
          }
        </div>`
    })

    html += `</div></div>`
  })

  return html + '</div></div>'
}

function goToPage(idx) {
  // Fermer toutes les lignes ouvertes et la carte de détail
  document.querySelectorAll('.subject-row.open').forEach(r => r.classList.remove('open'))
  document.querySelectorAll('[id^="gen-detail-"]').forEach(detail => {
    detail.style.display = 'none'
    const chevron = document.getElementById(detail.id.replace('gen-detail-', 'gen-chevron-'))
    if (chevron) chevron.style.transform = ''
  })
  currentPage = idx
  updatePager()
}

function updatePager() {
  $('period-pages').style.transform = `translateX(-${currentPage * 100}%)`
  $('period-tabs').querySelectorAll('.period-tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === currentPage)
  })
}

// ── Événements ─────────────────────────────────────────────────────────────
$('btn-login').addEventListener('click', () => {
  const username = $('input-username').value.trim()
  const password = $('input-password').value
  if (!username || !password) { showError('Identifiant et mot de passe requis'); return }
  login(username, password)
})
$('input-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btn-login').click()
})
$('eye-btn').addEventListener('click', () => {
  const input = $('input-password')
  input.type = input.type === 'password' ? 'text' : 'password'
})
$('btn-normalize').addEventListener('click', () => {
  normalizeOn = !normalizeOn
  $('btn-normalize').textContent = normalizeOn ? '/20' : '/x'
  $('btn-normalize').classList.toggle('active', normalizeOn)
  document.body.classList.toggle('normalize', normalizeOn)
})
$('btn-logout').addEventListener('click', () => {
  clearStorage()
  xToken = null
  $('input-username').value = ''
  $('input-password').value = ''
  $('login-error').style.display = 'none'
  showScreen('login')
})

function toggleGenCard(periodId) {
  const detail  = document.getElementById(`gen-detail-${periodId}`)
  const chevron = document.getElementById(`gen-chevron-${periodId}`)
  const isOpen  = detail.style.display === 'block'
  detail.style.display     = isOpen ? 'none' : 'block'
  chevron.style.transform  = isOpen ? '' : 'rotate(180deg)'
}

window.addEventListener('load', () => {
  const creds = loadCredentials()
  if (creds) login(creds.username, creds.password)
})

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/ED/sw.js')
}
</script>
</body>
</html>
