<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoleDirecte — Mes notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --blue:      #1565C0;
  --blue-dark: #0D47A1;
  --accent:    #00BCD4;
  --bg:        #F0F4FF;
  --surface:   #FFFFFF;
  --text:      #1A1A2E;
  --muted:     #6B7280;
  --border:    #E8EEF9;
  --orange:    #E65100;
  --gray:      #9CA3AF;
  --shadow:    0 2px 12px rgba(21,101,192,.10);
  --shadow-lg: 0 8px 32px rgba(21,101,192,.14);
  --radius:    16px;
  --radius-sm: 10px;
  --max-width: 680px;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  font-family:'DM Sans',sans-serif;
  background: #F0F4FF;
  min-height:100vh; color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.screen { display:none; }
.screen.active { display:flex; }

/* ── News ── */
.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.popup.hidden {
  display: none;
}

.news-content {
  width: 90%;
  max-width: 420px;
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

#close-news {
  margin-top: 16px;
  width: 100%;
  padding: 12px 14px;

  border: none;
  border-radius: 10px;

  background: #1565C0;
  color: white;

  font-weight: 600;
  font-size: 14px;

  cursor: pointer;

  transition: transform 0.1s, background 0.2s;
}

#close-news:hover {
  background: #0D47A1;
}

#close-news:active {
  transform: scale(0.98);
}
#news-text {
  white-space: pre-line;
  margin: 12px 0;
}

/* ── LOGIN ── */
#screen-login { min-height:100vh; align-items:center; justify-content:center; padding:24px; }
.login-card {
  background:var(--surface); border-radius:24px;
  box-shadow:var(--shadow-lg); padding:40px 36px;
  width:100%; max-width:420px; animation:fadeUp .4s ease;
}
.login-logo {
  width:72px; height:72px; border-radius:20px;
  background:linear-gradient(135deg,var(--blue),var(--accent));
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 20px; font-size:32px;
}
.login-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:26px; font-weight:800; color:var(--blue-dark); text-align:center; }
.login-sub { font-size:14px; color:var(--muted); text-align:center; margin-top:4px; margin-bottom:32px; }
.field { margin-bottom:16px; position:relative; }
.field label { display:block; font-size:12px; font-weight:500; color:var(--muted); margin-bottom:6px; letter-spacing:.04em; text-transform:uppercase; }
.field input {
  width:100%; padding:13px 16px;
  border:1.5px solid var(--border); border-radius:var(--radius-sm);
  font-family:'DM Sans',sans-serif; font-size:15px;
  color:var(--text); background:var(--bg);
  outline:none; transition:border-color .2s,box-shadow .2s;
}
.field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(21,101,192,.12); background:#fff; }
.eye-btn { position:absolute; right:12px; bottom:11px; background:none; border:none; cursor:pointer; color:var(--gray); font-size:18px; padding:2px; }
.btn-primary {
  width:100%; padding:14px;
  background:var(--blue); color:#fff; border:none; border-radius:var(--radius-sm);
  font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; font-weight:700;
  cursor:pointer; margin-top:8px;
  transition:background .2s,transform .1s,box-shadow .2s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary:hover { background:var(--blue-dark); box-shadow:0 4px 16px rgba(21,101,192,.3); }
.btn-primary:active { transform:scale(.98); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.error-box {
  background:rgba(229,57,53,.08); border-radius:var(--radius-sm);
  padding:12px 14px; margin-top:14px;
  color:#c62828; font-size:13px;
  display:flex; align-items:center; gap:8px; animation:fadeIn .2s ease;
}
.login-footer { text-align:center; margin-top:24px; font-size:12px; color:#B0BEC5; }

/* ── LOADING ── */
#screen-loading { min-height:100vh; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
.spinner { width:48px; height:48px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; }
.loading-text { font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; font-weight:600; color:var(--blue-dark); }
.loading-sub { font-size:13px; color:var(--muted); }

/* ── MFA ── */
#screen-mfa { min-height:100vh; align-items:center; justify-content:center; padding:24px; }
.mfa-card { background:var(--surface); border-radius:24px; box-shadow:var(--shadow-lg); padding:36px; width:100%; max-width:420px; animation:fadeUp .4s ease; }
.mfa-icon { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#FF6B35,#FFB74D); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 20px; }
.mfa-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:22px; font-weight:800; color:var(--blue-dark); text-align:center; margin-bottom:4px; }
.mfa-sub { font-size:14px; color:var(--muted); text-align:center; margin-bottom:24px; }
.mfa-question { background:#FFF8E1; border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:16px; font-size:15px; font-weight:500; color:#4A4A4A; display:flex; gap:10px; }
.mfa-options { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
.mfa-option { border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; cursor:pointer; background:var(--surface); display:flex; align-items:center; gap:12px; font-size:15px; transition:all .15s; }
.mfa-option:hover { border-color:var(--blue); background:#EEF2FF; }
.mfa-option.selected { background:var(--blue); border-color:var(--blue); color:#fff; }
.mfa-radio { width:20px; height:20px; border-radius:50%; border:2px solid currentColor; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.mfa-option.selected .mfa-radio::after { content:''; width:10px; height:10px; border-radius:50%; background:#fff; display:block; }

/* ── GRADES ── */
#screen-grades { flex-direction:column; min-height:100vh; }
.grades-header { background:var(--surface); box-shadow:var(--shadow); position:sticky; top:0; z-index:10; }
.grades-header-inner { max-width:var(--max-width); margin:0 auto; }
.grades-header-top { display:flex; align-items:center; padding:14px 20px 8px; gap:12px; }
.grades-header-top h1 { font-family:'Plus Jakarta Sans',sans-serif; font-size:20px; font-weight:800; color:var(--blue-dark); flex:1; }
.student-name { font-size:13px; color:var(--muted); }
.btn-logout { background:none; border:none; cursor:pointer; color:var(--gray); font-size:20px; padding:6px; border-radius:8px; transition:background .15s,color .15s; }
.btn-logout:hover { background:var(--border); color:#c62828; }

/* Onglets */
.period-tabs { display:flex; gap:8px; padding:0 12px 12px; }
.period-tab {
  flex:1; padding:8px 6px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:600; text-align:center;
  cursor:pointer; border:none;
  background:#EEF2FF; color:#374151;
  transition:background .15s,color .15s;
  font-family:'DM Sans',sans-serif;
}
.period-tab.active { background:var(--blue); color:#fff; }

/* Pager */
.period-pager { flex:1; overflow:hidden; }
.period-pages { display:flex; height:100%; transition:transform .35s cubic-bezier(.4,0,.2,1); }
.period-page { min-width:100%; overflow-y:auto; padding:16px; }
.period-page-inner { max-width:var(--max-width); margin:0 auto; }

/* Moyenne générale */
.general-avg-card {
  background:var(--blue); border-radius:var(--radius);
  padding:18px 20px; display:flex; align-items:center;
  margin-bottom:14px; box-shadow:0 4px 16px rgba(21,101,192,.25);
}
.general-avg-card .label { flex:1; }
.general-avg-card .label-title { font-size:13px; color:rgba(255,255,255,.8); font-weight:500; }
.general-avg-card .label-period { font-size:11px; color:rgba(255,255,255,.55); }
.general-avg-card .value { font-family:'Plus Jakarta Sans',sans-serif; font-size:30px; font-weight:800; color:#fff; }

/* Tableau matières */
.subjects-table { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.subject-row { border-bottom:1px solid var(--border); cursor:pointer; }
.subject-row:last-child { border-bottom:none; }
.subject-main { display:flex; align-items:center; padding:13px 16px; gap:12px; transition:background .12s; }
.subject-row:hover .subject-main { background:#FAFBFF; }
.subject-bar { width:4px; height:34px; border-radius:2px; flex-shrink:0; }
.subject-info { flex:1; min-width:0; }
.subject-name { font-size:14px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.subject-class-avg { font-size:11px; color:var(--gray); margin-top:1px; }
.subject-chevron { font-size:16px; color:var(--gray); transition:transform .2s; flex-shrink:0; }
.subject-row.open .subject-chevron { transform:rotate(180deg); }
.subject-avg { font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; font-weight:700; flex-shrink:0; }

/* Notes dépliées */
.subject-grades { display:none; background:#F8FAFF; padding:4px 16px 12px 32px; }
.subject-row.open .subject-grades { display:block; }
.grade-row { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed #EEF2FF; }
.grade-row:last-child { border-bottom:none; }
.grade-info { flex:1; min-width:0; }
.grade-name { font-size:12px; color:#374151; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.grade-date { font-size:10px; color:var(--gray); }
.grade-coef { font-size:10px; color:var(--gray); flex-shrink:0; }
.grade-badge { font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:700; padding:3px 10px; border-radius:7px; flex-shrink:0; }

.c-blue   { color:var(--blue); }
.c-orange { color:var(--orange); }
.c-gray   { color:var(--gray); }
.bg-blue   { background:rgba(21,101,192,.12); }
.bg-orange { background:rgba(230,81,0,.12); }
.bg-gray   { background:rgba(156,163,175,.12); }
.bar-blue   { background:var(--blue); }
.bar-orange { background:var(--orange); }
.bar-gray   { background:var(--gray); }

@keyframes spin   { to { transform:rotate(360deg); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>

<meta name="apple-mobile-web-app-capable" content="yes">

  <div class="login-card">
    <div class="login-logo">🎓</div>

    <div class="field">

<!-- LOADING -->

  <div class="loading-text" id="loading-text">Connexion…</div>

</div>

<!-- MFA -->
<div id="screen-mfa" class="screen">
  <div class="mfa-card">
    <div class="mfa-icon">🛡️</div>
    <div class="mfa-title">Double authentification</div>
    <div class="mfa-sub">Choisissez votre réponse</div>
    <div class="mfa-question"><span>❓</span><span id="mfa-question-text"></span></div>
    <div class="mfa-options" id="mfa-options"></div>
    <button class="btn-primary" id="btn-mfa" disabled><span>Valider</span></button>
  </div>
</div>

<!-- GRADES -->
<div id="screen-grades" class="screen">
  <div class="grades-header">
    <div class="grades-header-inner">
      <div class="grades-header-top">
        <div>
          <h1>Mes moyennes</h1>
          <div class="student-name" id="student-name"></div>
        </div>

<script>
let currentPage = 0

const $ = id => document.getElementById(id)

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
  $(`screen-${name}`).classList.add('active')
}
function showLoading(text, sub = '') {
  $('loading-text').textContent = text
  $('loading-sub').textContent = sub
  showScreen('loading')
}
function showError(msg) {
  $('login-error-msg').textContent = msg
  $('login-error').style.display = 'flex'
}
function showNews(text) {
  document.getElementById("news-popup").classList.remove("hidden")
  
  document.getElementById("news-title").textContent =
    "News"
  document.getElementById("news-text").textContent =
    text
}
</script>

<script src="api.js"></script>

<script>
// ── Couleurs ───────────────────────────────────────────────────────────────
// Note : bleu si >= moyenne de CLASSE, orange sinon
function gradeColor(normalized, classAvgNormalized) {
  if (classAvgNormalized === null) return 'gray'
  return normalized >= classAvgNormalized ? 'blue' : 'orange'
}
// Moyenne matière : bleu si >= moyenne de classe de la matière, orange sinon
function subjectColor(avg, classAvg) {
  if (avg === null) return 'gray'
  if (classAvg === null) return 'blue' // pas de moyenne classe = pas de comparaison
  return avg >= classAvg ? 'blue' : 'orange'
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderGrades(studentName, periods) {
  $('student-name').textContent = studentName
  const tabs = $('period-tabs'), pages = $('period-pages')
  tabs.innerHTML = ''; pages.innerHTML = ''

  let initialPage = 0
  for (let i = periods.length - 1; i >= 0; i--) {
    if (periods[i].subjects.some(s => s.grades.some(g => g.value !== null))) { initialPage = i; break }
  }

  periods.forEach((period, idx) => {
    const tab = document.createElement('button')
    tab.className = 'period-tab' + (idx === initialPage ? ' active' : '')
    tab.textContent = `T${idx + 1}`
    tab.addEventListener('click', () => goToPage(idx))
    tabs.appendChild(tab)

    const page = document.createElement('div')
    page.className = 'period-page'
    page.innerHTML = `<div class="period-page-inner">${renderPeriodPage(period)}</div>`
    pages.appendChild(page)
  })

  pages.querySelectorAll('.subject-row').forEach(row => {
    row.addEventListener('click', () => row.classList.toggle('open'))
  })

  currentPage = initialPage
  updatePager()
  showScreen('grades')
}

function renderPeriodPage(period) {
  const avg = period.generalAverage
  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100
  
  const tcAvg = period.tc.map(s => round2(s.average)).filter(a => a !== null && a > 0)
  const tcMoy = tcAvg.length ? tcAvg.reduce((s,a) => s + a, 0) / tcAvg.length : null
  const tcMoyR = Math.round(tcMoy * 100) / 100
  const optAvg = period.opt.map(s => round2(s.average)).filter(a => a !== null && a > 0)
  const optMoy = optAvg.length ? optAvg.reduce((s,a) => s + a, 0) / optAvg.length : null
  const optMoyR = Math.round(optMoy * 100) / 100
  
  const tcDiffers  = tcMoyR  !== null && period.edTcMoy  !== null &&
    parseFloat(tcMoyR)  !== parseFloat(period.edTcMoy.toFixed(2))
  const optDiffers = optMoyR !== null && period.edOptMoy !== null &&
    parseFloat(optMoyR) !== parseFloat(period.edOptMoy.toFixed(2))

  let html = `
    <div class="general-avg-card" id="gen-card-${period.periodId}" onclick="toggleGenCard('${period.periodId}')" style="cursor:pointer;flex-direction:column;gap:0;position:relative">
      ${period.isClosed ? `<div style="position:absolute;top:3px;left:3px;font-size:16px;">🔒</div>` : ''}
      <div style="display:flex;align-items:center;width:100%">
        <div class="label">
          <div class="label-title">Moyenne générale</div>
          <div class="label-period">${period.label}</div>
        </div>
        <span id="gen-chevron-${period.periodId}" style="color:rgba(255,255,255,.7);font-size:18px;margin-right:8px;transition:transform .2s">⌄</span>
        <div class="value">${avg != null ? parseFloat(Math.round(avg * 100) / 100) + '/20' : '—'}</div>
      </div>
      <div id="gen-detail-${period.periodId}" style="display:none;width:100%;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)">
        <div style="display:flex;justify-content:space-between;gap:12px">
          <div style="flex:1;background:rgba(255,255,255,.12);border-radius:10px;padding:12px">
            <div style="font-size:11px;color:rgba(255,255,255,.7);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Tronc commun</div>
            <div style="font-size:22px;color:#fff;margin-bottom:4px;${tcDiffers ? 'font-weight:900;text-decoration:underline;' : 'font-weight:800;'}">${tcMoyR != null ? parseFloat(tcMoyR) + '/20' : '—'}</div>
            ${tcDiffers && period.edTcMoy != null ? `<div style="font-size:10px;color:rgba(255,255,255,.55)">ED : ${parseFloat(period.edTcMoy.toFixed(2))}</div>` : ''}
          </div>
          <div style="flex:1;background:rgba(255,255,255,.12);border-radius:10px;padding:12px">
            <div style="font-size:11px;color:rgba(255,255,255,.7);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Options</div>
            <div style="font-size:22px;color:#fff;margin-bottom:4px;${optDiffers ? 'font-weight:900;text-decoration:underline;' : 'font-weight:800;'}">${optMoyR != null ? parseFloat(optMoyR) + '/20' : '—'}</div>
            ${optDiffers && period.edOptMoy != null ? `<div style="font-size:10px;color:rgba(255,255,255,.55)">ED : ${parseFloat(period.edOptMoy.toFixed(2))}</div>` : ''}
          </div>
        </div>
      </div>
    </div>`

  period.subjects.forEach(subject => {
    // Couleur matière : par rapport à la moyenne de classe de la matière
    const col = subjectColor(subject.average, subject.classAverage)
    const avgDisp = subject.average !== null ? parseFloat(subject.average.toFixed(2)) + '/20' : '—'
const differs = subject.average !== null && subject.edAverage !== null &&
  parseFloat(subject.average.toFixed(2)) !== parseFloat(subject.edAverage.toFixed(2))
    const classDisp = subject.classAverage !== null ? `Classe : ${subject.classAverage.toFixed(1)}` : ''

    html += `
      <div class="subject-row">
        <div class="subject-main">
          <div class="subject-bar bar-${col}"></div>
          <div class="subject-info">
            <div class="subject-name">${subject.name}</div>
            ${classDisp ? `<div class="subject-class-avg">${classDisp}</div>` : ''}
          </div>
          <span class="subject-chevron">⌄</span>
          <div class="subject-avg c-${col}" style="${differs ? 'font-weight:800;text-decoration:underline;' : ''}">${avgDisp}</div>
        </div>
        <div class="subject-grades">`

    const validGrades = subject.grades.filter(g => g.value !== null || g.isDispensed || g.nonSignificatif)
    if (validGrades.length === 0) {
      html += `<div style="padding:8px 0;font-size:12px;color:var(--gray)">Aucune note</div>`
    } else {
      validGrades.forEach(g => {
        // Couleur note : par rapport à la moyenne de classe de CE devoir (ramenée sur 20)
        const classAvgNorm = g.classAvg !== null && g.outOf > 0 ? (g.classAvg / g.outOf) * 20 : null
        const gc = gradeColor(g.normalized, classAvgNorm)
        const coefStr = g.coef !== 1 ? `×${Number.isInteger(g.coef) ? g.coef : g.coef}` : ''
        const outOfStr = g.outOf % 1 === 0 ? g.outOf : g.outOf.toFixed(1)
        html += `
          <div class="grade-row">
            <div class="grade-info">
              <div class="grade-name">${g.name || 'Devoir'}</div>
              ${g.date ? `<div class="grade-date">${g.date}</div>` : ''}
            </div>
            ${coefStr ? `<div class="grade-coef">${coefStr}</div>` : ''}
            ${g.isDispensed
              ? `<div class="grade-badge c-gray bg-gray">${g.rawVal || 'Disp.'}</div>`
              : g.nonSignificatif
                ? `<div class="grade-badge c-gray bg-gray">(${parseFloat(g.value.toFixed(2))}/${outOfStr})</div>`
                : `<div class="grade-badge c-${gc} bg-${gc}">${parseFloat(g.value.toFixed(2))}/${outOfStr}</div>`
            }
          </div>`
      })
    }
    html += `</div></div>`
  })

  return html + '</div>'
}

function goToPage(idx) { currentPage = idx; updatePager() }
function updatePager() {
  $('period-pages').style.transform = `translateX(-${currentPage * 100}%)`
  $('period-tabs').querySelectorAll('.period-tab').forEach((t, i) => t.classList.toggle('active', i === currentPage))
}

// ── Events ─────────────────────────────────────────────────────────────────
$('btn-login').addEventListener('click', () => {
  const u = $('input-username').value.trim(), p = $('input-password').value
  if (!u || !p) { showError('Identifiant et mot de passe requis'); return }
  login(u, p)
})
$('input-password').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click() })
$('eye-btn').addEventListener('click', () => {
  const inp = $('input-password')
  inp.type = inp.type === 'password' ? 'text' : 'password'
})
$('btn-logout').addEventListener('click', () => {
  clearStorage(); xToken = null
  $('input-username').value = ''; $('input-password').value = ''
  $('login-error').style.display = 'none'
  showScreen('login')
})
document.getElementById("close-news").addEventListener("click", () => {
  document.getElementById("news-popup").classList.add("hidden")
  localStorage.setItem("ed_last_news", textHash)
})
function toggleGenCard(periodId) {
  const detail = document.getElementById(`gen-detail-${periodId}`)
  const chevron = document.getElementById(`gen-chevron-${periodId}`)
  const open = detail.style.display === 'block'
  detail.style.display = open ? 'none' : 'block'
  chevron.style.transform = open ? '' : 'rotate(180deg)'
}

window.addEventListener('load', () => {
  checkNews()
  const creds = loadCredentials()
  if (creds) login(creds.username, creds.password)
})

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/ED/sw.js')
}
</script>
